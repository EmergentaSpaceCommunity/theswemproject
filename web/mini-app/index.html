<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SWEM</title>
<!-- A channel's Mini App: opened from a bot inside the messenger, it knows
     who opened it by the messenger's signature and does what the bot cannot
     carry: a file of any size to the agent, what the agent put out, the
     chat as it stands. One static page: the Workbench serves it with the
     palette and kit inlined and the channel written in; `scripts/mini-app.mjs`
     writes the same page as `web/mini-app/dist/index.html`, to be hosted
     anywhere (the bot's button then carries the Workbench's address). -->
<style>__PALETTE_CSS__</style>
<style>__KIT_CSS__</style>
<style>
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; font:var(--font-weight-normal) var(--font-text-md-size)/var(--font-text-md-line-height) var(--font-sans);
    color:var(--color-text-primary); background:var(--color-background-primary); }
  main { display:grid; gap:16px; max-width:640px; margin:0 auto; }
  h1 { margin:0; font-size:var(--font-text-lg-size); }
  .k-card { display:grid; gap:10px; }
  .messages { display:grid; gap:8px; max-height:40vh; overflow:auto; }
  .message { display:grid; gap:2px; }
  .message .k-caption { opacity:.7; }
  .files a, .files button { cursor:pointer; }
  input[type=file] { max-width:100%; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main id="app">
  <section class="k-card" id="who" hidden>
    <h1 id="title"></h1>
    <span class="k-caption" id="you"></span>
  </section>
  <section class="k-card" id="nobody">
    <h1>SWEM</h1>
    <span class="k-caption" id="why">This page is opened from a bot in your messenger, which says who you are.</span>
  </section>
  <section class="k-card" id="ask" hidden>
    <span class="k-eyebrow">The agent asks</span>
    <span id="asked"></span>
    <form id="fields" class="k-stack"></form>
    <div class="k-inline">
      <button class="k-btn k-primary" id="answer" type="button">Answer</button>
      <button class="k-btn" id="decline" type="button">Not this</button>
    </div>
    <span class="k-caption">Or say something else instead - the agent reads it as your answer:</span>
    <input class="k-field" id="instead" placeholder="Something else">
    <button class="k-btn" id="say-instead" type="button">Say it</button>
    <span class="k-caption" id="answered"></span>
  </section>
  <section class="k-card" id="say" hidden>
    <span class="k-eyebrow">Say something in the chat</span>
    <input class="k-field" id="words-to-say" placeholder="What to say">
    <button class="k-btn" id="say-it" type="button">Say it</button>
    <span class="k-caption" id="said"></span>
  </section>
  <section class="k-card" id="send" hidden>
    <span class="k-eyebrow">A file to the agent, of any size</span>
    <input type="file" id="file">
    <input class="k-field" id="words" placeholder="What to say with it (optional)">
    <button class="k-btn k-primary" id="upload" type="button">Send</button>
    <span class="k-caption" id="sending"></span>
  </section>
  <section class="k-card" id="handed" hidden>
    <span class="k-eyebrow">What the agent put out</span>
    <div class="files" id="files"></div>
  </section>
  <section class="k-card" id="chat" hidden>
    <span class="k-eyebrow">The chat</span>
    <div class="messages" id="messages"></div>
  </section>
</main>
<script>
(() => {
  // Served by the Workbench itself, the channel is written in; hosted
  // anywhere else, the bot's button says where the Workbench is and which
  // channel: ?at=https://workbench.example.org&channel=<id>.
  const query = new URLSearchParams(location.search);
  const channel = query.get("channel") || "__CHANNEL_ID__";
  const at = (query.get("at") || "").replace(/\/+$/, "");
  const api = `${at}/api/channels/${encodeURIComponent(channel)}/app`;
  const $ = (id) => document.getElementById(id);
  // What the messenger signed, from the fragment it opens the page with.
  // The page needs no script of the messenger's: the signed data is in the
  // address, and the channel is what checks it.
  const fromHash = () => {
    const hash = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
    const found = new URLSearchParams(hash).get("tgWebAppData");
    return found ?? "";
  };
  const initData = fromHash();
  const headers = { "x-swem-app-data": initData };
  const when = (ms) => (ms ? new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "");
  const show = (standing) => {
    $("nobody").hidden = true;
    for (const id of ["who", "say", "send", "chat"]) $(id).hidden = false;
    $("handed").hidden = standing.files.length === 0 && !standing.owner;
    $("title").textContent = standing.bot && standing.bot.name ? standing.bot.name : standing.chat.title;
    $("you").textContent = `You are ${standing.you.name} here; ${standing.agent} answers.`;
    const files = $("files");
    files.replaceChildren();
    if (standing.files.length === 0) {
      const none = document.createElement("span");
      none.className = "k-caption";
      none.textContent = "Nothing yet.";
      files.append(none);
    }
    for (const file of standing.files) {
      const row = document.createElement("div");
      row.className = "k-row";
      row.dataset.file = file.name;
      const name = document.createElement("span");
      name.className = "k-name k-grow";
      name.textContent = file.name;
      const size = document.createElement("span");
      size.className = "k-caption";
      size.textContent = `${Math.max(1, Math.round(file.byte_length / 1024))} KB`;
      const get = document.createElement("button");
      get.className = "k-btn k-quiet";
      get.type = "button";
      get.textContent = "Save";
      get.addEventListener("click", async () => {
        const response = await fetch(`${api}/files/${encodeURIComponent(file.name)}`, { headers });
        if (!response.ok) return;
        const url = URL.createObjectURL(await response.blob());
        const a = document.createElement("a");
        a.href = url;
        a.download = file.name;
        a.click();
        URL.revokeObjectURL(url);
      });
      row.append(name, size, get);
      files.append(row);
    }
    const messages = $("messages");
    messages.replaceChildren();
    for (const message of standing.messages) {
      const one = document.createElement("div");
      one.className = "message";
      one.dataset.message = "";
      const by = document.createElement("span");
      by.className = "k-caption";
      by.textContent = `${message.by} · ${when(message.at_ms)}`;
      const text = document.createElement("span");
      text.textContent = message.text;
      one.append(by, text);
      messages.append(one);
    }
    messages.scrollTop = messages.scrollHeight;
  };
  const read = async () => {
    if (!initData) return;
    const response = await fetch(api, { headers });
    if (!response.ok) {
      const said = await response.json().catch(() => ({}));
      $("why").textContent = said.error || `The Workbench did not let this page in (${response.status}).`;
      $("why").dataset.refused = String(response.status);
      return;
    }
    show(await response.json());
  };
  // A question the agent asks, when the page was opened to answer one.
  const question = query.get("question") || "";
  // The choices a property offers: `enum`, or `oneOf`/`anyOf` of consts with
  // titles; for a list, the same on its items.
  const choicesOf = (d) => {
    if (!d) return null;
    if (Array.isArray(d.enum)) return d.enum.map((value) => ({ value, title: String(value) }));
    const options = d.oneOf || d.anyOf;
    if (Array.isArray(options)) return options.filter((one) => one && "const" in one).map((one) => ({ value: one.const, title: one.title || String(one.const) }));
    return null;
  };
  const fieldsOf = (schema) => Object.entries((schema && schema.properties) || {}).map(([name, d]) => ({
    name,
    label: d.title || name,
    type: d.type || "string",
    choices: d.type === "array" ? choicesOf(d.items) : choicesOf(d),
    required: Array.isArray(schema.required) && schema.required.includes(name),
    description: d.description || "",
  }));
  let fields = [];
  const say = async (text) => {
    const response = await fetch(`${api}/messages`, {
      method: "POST",
      headers: { ...headers, "content-type": "application/json" },
      body: JSON.stringify({ text }),
    });
    return response.ok;
  };
  const answer = async (body) => {
    const response = await fetch(`${api}/questions/${encodeURIComponent(question)}/answer`, {
      method: "POST",
      headers: { ...headers, "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    const said = await response.json().catch(() => ({}));
    $("answered").textContent = response.ok ? "Answered." : said.error || `Not answered (${response.status}).`;
    if (response.ok) $("answered").dataset.answered = body.action;
    for (const id of ["answer", "decline", "say-instead"]) $(id).disabled = response.ok;
  };
  const readQuestion = async () => {
    if (!question || !initData) return;
    const response = await fetch(`${api}/questions/${encodeURIComponent(question)}`, { headers });
    if (!response.ok) {
      const said = await response.json().catch(() => ({}));
      $("ask").hidden = false;
      $("asked").textContent = said.error || "This question is no longer waiting.";
      for (const id of ["answer", "decline", "say-instead"]) $(id).disabled = true;
      return;
    }
    const asked = await response.json();
    $("ask").hidden = false;
    $("asked").textContent = asked.message || "";
    fields = asked.mode === "form" ? fieldsOf(asked.requestedSchema) : [];
    const form = $("fields");
    form.replaceChildren();
    for (const field of fields) {
      const label = document.createElement("label");
      label.className = "k-stack";
      const caption = document.createElement("span");
      caption.className = "k-caption";
      caption.textContent = field.label + (field.required ? "" : " (if you like)");
      let input;
      if (field.type === "array" && field.choices) {
        // Several of a list: a box each.
        input = document.createElement("span");
        input.className = "k-inline";
        for (const choice of field.choices) {
          const one = document.createElement("label");
          const box = document.createElement("input");
          box.type = "checkbox";
          box.value = String(choice.value);
          box.dataset.choiceOf = field.name;
          one.append(box, document.createTextNode(` ${choice.title}`));
          input.append(one);
        }
      } else if (field.choices) {
        input = document.createElement("select");
        if (!field.required) input.append(document.createElement("option"));
        for (const choice of field.choices) {
          const option = document.createElement("option");
          option.value = String(choice.value);
          option.textContent = choice.title;
          input.append(option);
        }
      } else if (field.type === "boolean") {
        input = document.createElement("input");
        input.type = "checkbox";
      } else {
        input = document.createElement("input");
        input.type = field.type === "number" || field.type === "integer" ? "number" : "text";
      }
      if (input.tagName !== "SPAN") input.className = "k-field";
      input.dataset.field = field.name;
      label.append(caption, input);
      if (field.description) {
        const hint = document.createElement("span");
        hint.className = "k-caption";
        hint.textContent = field.description;
        label.append(hint);
      }
      form.append(label);
    }
    if (asked.mode === "url" && asked.url) {
      $("answer").textContent = "Open it";
      $("asked").textContent = `${asked.message || ""} It opens ${asked.url}.`;
      $("answer").dataset.url = asked.url;
    }
  };
  $("answer").addEventListener("click", () => {
    if ($("answer").dataset.url) window.open($("answer").dataset.url, "_blank", "noopener");
    const content = {};
    for (const field of fields) {
      const input = document.querySelector(`[data-field="${CSS.escape(field.name)}"]`);
      if (!input) continue;
      if (field.type === "array") {
        const picked = [...document.querySelectorAll(`[data-choice-of="${CSS.escape(field.name)}"]`)].filter((box) => box.checked).map((box) => box.value);
        if (picked.length > 0 || field.required) content[field.name] = picked;
      } else if (field.type === "boolean") content[field.name] = input.checked;
      else if (input.value === "") continue;
      else if (field.type === "number") content[field.name] = Number(input.value);
      else if (field.type === "integer") content[field.name] = Math.trunc(Number(input.value));
      else content[field.name] = input.value;
    }
    void answer(fields.length > 0 ? { action: "accept", content } : { action: "accept" });
  });
  $("decline").addEventListener("click", () => void answer({ action: "decline" }));
  $("say-instead").addEventListener("click", async () => {
    const text = $("instead").value.trim();
    if (!text) return;
    await answer({ action: "decline" });
    if (await say(text)) $("answered").textContent = "Declined, and said instead.";
  });
  $("say-it").addEventListener("click", async () => {
    const text = $("words-to-say").value.trim();
    if (!text) return;
    $("said").textContent = (await say(text)) ? "Said." : "Not said.";
    if ($("said").textContent === "Said.") $("words-to-say").value = "";
    await read();
  });
  const readOrSay = async () => {
    try {
      await read();
    } catch {
      $("why").textContent = at
        ? "This Workbench has no address from outside right now - its tunnel may have closed. Send /app to the bot and open this page again."
        : "The Workbench cannot be reached from here. Send /app to the bot and open this page again.";
      $("why").dataset.unreachable = "";
      for (const id of ["who", "send", "handed", "chat"]) $(id).hidden = true;
      $("nobody").hidden = false;
    }
  };
  $("upload").addEventListener("click", async () => {
    const file = $("file").files[0];
    if (!file) return;
    $("sending").textContent = `Sending ${file.name}…`;
    $("upload").disabled = true;
    try {
      const response = await fetch(`${api}/files?name=${encodeURIComponent(file.name)}&words=${encodeURIComponent($("words").value)}`, {
        method: "POST",
        headers: { ...headers, "content-type": file.type || "application/octet-stream" },
        body: file,
      });
      const said = await response.json().catch(() => ({}));
      $("sending").textContent = response.ok ? `Sent ${said.name} to the agent.` : said.error || `Not sent (${response.status}).`;
      if (response.ok) $("sending").dataset.sent = said.name;
      await read();
    } finally {
      $("upload").disabled = false;
    }
  });
  // The messenger opens the page with its data in the fragment; opened
  // again with other data, the page starts over.
  window.addEventListener("hashchange", () => location.reload());
  void readOrSay();
  void readQuestion();
  setInterval(() => void readOrSay(), 5000);
})();
</script>
</body>
</html>

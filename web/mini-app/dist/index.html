<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SWEM</title>
<!-- A channel's Mini App: opened from a bot inside the messenger, it knows
     who opened it by the messenger's signature and does what the bot cannot
     carry: a file of any size to the agent, what the agent put out, the
     chat as it stands. One static page: the Workbench serves it with the
     palette and kit inlined and the channel written in; `scripts/mini-app.mjs`
     writes the same page as `web/mini-app/dist/index.html`, to be hosted
     anywhere (the bot's button then carries the Workbench's address). -->
<style>/* The SWEM palette: every value the host-style vocabulary names, in both
* themes, in one place.
*
* It lives beside the kit rather than inside the Workbench shell because the
* shell is not the only surface that needs a value before a host has sent one.
* A domain App rendered standalone, or opened before `ui/initialize` returns,
* has no host context yet; without this it would draw with every variable
* empty. Each App used to carry its own copy of ten of these colours and
* nothing else, which is how two surfaces of one product came to disagree
* about what "muted" meant.
*
* Inside a host these are overridden by whatever that host sends, which is the
* point: SWEM's values are a default, not a requirement.
*/

:root { color-scheme:dark;
  /* Surfaces: page, content, raised. */
  --color-background-primary:#09090b; --color-background-secondary:#18181b; --color-background-tertiary:#27272a;
  /* Semantic fills are solid and carry inverse text; a subtle banner is made
  from a semantic border and semantic text on a neutral surface instead.
  Danger and info sit one step lighter than the palette spells them: on a
  dark ground the fill carries near-black text, and the darker shades fail
  the floor at 4.17 and 3.79. Stepping along the palette's own ramp keeps
  the brand; warning and success already clear it unchanged. */
  --color-background-danger:#fb2c36; --color-background-warning:#d08700;
  --color-background-info:#2b7fff; --color-background-success:#00a63e;
  --color-background-inverse:#fafafa; --color-background-disabled:#27272a;
  --color-background-ghost:transparent;
  --color-text-primary:#f4f4f5; --color-text-secondary:#9f9fa9; --color-text-tertiary:#a1a1aa;
  --color-text-danger:#ff6467; --color-text-warning:#fdc700;
  --color-text-info:#51a2ff; --color-text-success:#05df72;
  --color-text-inverse:#09090b; --color-text-disabled:#71717b; --color-text-ghost:#a1a1aa;
  --color-border-primary:#52525c; --color-border-secondary:#3f3f47; --color-border-tertiary:#27272a;
  --color-border-danger:#ff6467; --color-border-warning:#fdc700;
  --color-border-info:#51a2ff; --color-border-success:#05df72;
  --color-border-inverse:#fafafa; --color-border-disabled:#3f3f47; --color-border-ghost:transparent;
  --color-ring-primary:#9f9fa9; --color-ring-secondary:#52525c;
  --color-ring-danger:#ff6467; --color-ring-warning:#fdc700;
  --color-ring-info:#51a2ff; --color-ring-success:#05df72; --color-ring-inverse:#fafafa;
  /* Elevation reads as light on a dark ground, so the shadows carry a ring
  rather than only a drop. */
  --shadow-hairline:0 0 0 1px rgb(255 255 255 / .07);
  --shadow-sm:0 1px 2px rgb(0 0 0 / .55), 0 0 0 1px rgb(255 255 255 / .05);
  --shadow-md:0 4px 12px rgb(0 0 0 / .55), 0 0 0 1px rgb(255 255 255 / .06);
  --shadow-lg:0 12px 32px rgb(0 0 0 / .6), 0 0 0 1px rgb(255 255 255 / .07);
  --bg:var(--color-background-primary); --panel:var(--color-background-secondary);
  --line:var(--color-border-secondary); --muted:var(--color-text-secondary); --text:var(--color-text-primary);
  /* The primary action inverts to a softened off-white on dark rather than
  glaring pure white; the brand hue stays an accent, not the CTA. */
  --accent:#e4e4e7; --accent2:var(--color-text-info); --bad:var(--color-text-danger); --on-accent:#09090b;
}
/* Type, weight, rhythm, radius and stroke do not change with the theme, so
they are declared once and both palettes inherit them. Sizes are a 1.25
ramp rounded to whole pixels; line heights are set for reading at 14px
body, which is the shell's base. */
:root {
  --font-sans:Manrope,Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --font-weight-normal:400; --font-weight-medium:500; --font-weight-semibold:600; --font-weight-bold:700;
  --font-text-xs-size:11px;  --font-text-xs-line-height:16px;
  --font-text-sm-size:12px;  --font-text-sm-line-height:18px;
  --font-text-md-size:14px;  --font-text-md-line-height:21px;
  --font-text-lg-size:16px;  --font-text-lg-line-height:24px;
  --font-heading-xs-size:13px;  --font-heading-xs-line-height:18px;
  --font-heading-sm-size:15px;  --font-heading-sm-line-height:21px;
  --font-heading-md-size:17px;  --font-heading-md-line-height:24px;
  --font-heading-lg-size:20px;  --font-heading-lg-line-height:28px;
  --font-heading-xl-size:24px;  --font-heading-xl-line-height:32px;
  --font-heading-2xl-size:30px; --font-heading-2xl-line-height:38px;
  --font-heading-3xl-size:36px; --font-heading-3xl-line-height:44px;
  --border-radius-xs:2px; --border-radius-sm:4px; --border-radius-md:6px;
  --border-radius-lg:10px; --border-radius-xl:14px; --border-radius-full:9999px;
  --border-width-regular:1px;
  /* Two decisions the host-style vocabulary has no name for, so SWEM owns
  them under its own prefix rather than bending a standard token: display
  type wants negative tracking, and a modal needs a scrim. Neither crosses
  the sandbox; the contract an App receives is still exactly the
  standard's. */
  --k-tracking-display:-.03em;
  --k-scrim:rgb(5 6 8 / .8);
}
/* Several text roles sit one step darker than the palette spells them. Those
shades are drawn for text on white content cards, while this contract also
carries the grey page and the divider surface, and the shipped-palette gate
holds every readable text role to 4.5:1 on all three. Stepping along the
palette's own ramps keeps the brand and clears the floor; inventing a
colour would not. */
:root[data-theme=light] { color-scheme:light;
  --color-background-primary:#f4f4f5; --color-background-secondary:#ffffff; --color-background-tertiary:#e4e4e7;
  --color-background-danger:#c10007; --color-background-warning:#894b00;
  --color-background-info:#1447e6; --color-background-success:#016630;
  --color-background-inverse:#18181b; --color-background-disabled:#e4e4e7;
  --color-background-ghost:transparent;
  --color-text-primary:#18181b; --color-text-secondary:#52525c; --color-text-tertiary:#5f5f6a;
  --color-text-danger:#c10007; --color-text-warning:#894b00;
  --color-text-info:#1447e6; --color-text-success:#016630;
  --color-text-inverse:#fafafa; --color-text-disabled:#9f9fa9; --color-text-ghost:#5f5f6a;
  --color-border-primary:#d4d4d8; --color-border-secondary:#e4e4e7; --color-border-tertiary:#f4f4f5;
  --color-border-danger:#c10007; --color-border-warning:#894b00;
  --color-border-info:#1447e6; --color-border-success:#016630;
  --color-border-inverse:#18181b; --color-border-disabled:#d4d4d8; --color-border-ghost:transparent;
  --color-ring-primary:#52525c; --color-ring-secondary:#d4d4d8;
  --color-ring-danger:#c10007; --color-ring-warning:#894b00;
  --color-ring-info:#1447e6; --color-ring-success:#016630; --color-ring-inverse:#18181b;
  --k-scrim:rgb(9 9 11 / .55);
  --shadow-hairline:0 0 0 1px rgb(9 9 11 / .08);
  --shadow-sm:0 1px 2px rgb(9 9 11 / .08), 0 0 0 1px rgb(9 9 11 / .05);
  --shadow-md:0 4px 12px rgb(9 9 11 / .1), 0 0 0 1px rgb(9 9 11 / .06);
  --shadow-lg:0 12px 32px rgb(9 9 11 / .14), 0 0 0 1px rgb(9 9 11 / .07);
  --accent:#18181b; --on-accent:#ffffff;
}
</style>
<style>/* SWEM view kit.
 *
 * One stylesheet, shared by the Workbench shell and by every domain App. It
 * lives outside `crates/` on purpose: the host and the domain modules are peers
 * that both consume it, and a kit owned by the host would make every domain
 * surface depend on the harness in order to look like SWEM.
 *
 * The rule that makes this a design system rather than another stylesheet:
 * EVERY value here is a standard MCP Apps host-style variable. No literal
 * colour, radius, font, weight, size, stroke or shadow appears below, and
 * `kit.test.mjs` fails the build if one does. That is what lets the same markup
 * render correctly inside the shell, inside a sandboxed App, and inside a
 * foreign Apps host that never heard of SWEM: the host supplies the values, the
 * kit supplies only the shapes.
 *
 * Classes are prefixed `k-` because a foreign host has its own `.card`.
 *
 * The primitives are not invented. They are the shapes the shell had already
 * grown in six different spellings - ten `*-row` classes, four `*-card`
 * classes, two chip classes - each with its own hand-picked radius and its own
 * idea of a muted colour. Naming them once is the whole point.
 */

/* ---- foundation ------------------------------------------------------- */

.k-root {
  font: var(--font-weight-normal) var(--font-text-md-size) / var(--font-text-md-line-height) var(--font-sans);
  color: var(--color-text-primary);
  background: var(--color-background-primary);
}

/* Stack and row are the two layout primitives every surface reached for by
   hand. `--k-gap` defaults to the body line rhythm so spacing follows type. */
.k-stack { display: flex; flex-direction: column; gap: var(--k-gap, var(--font-text-sm-line-height)); }
.k-inline { display: flex; align-items: center; flex-wrap: wrap; gap: var(--k-gap, var(--font-text-sm-size)); }
.k-spread { display: flex; align-items: center; justify-content: space-between; gap: var(--font-text-md-size); }
.k-grow { flex: 1 1 auto; min-width: 0; }

/* The one decision the standard does not carry a name for. An eyebrow is only
   legible in caps when it is tracked out, and there is no host letter-spacing
   variable to inherit, so the kit owns this and says so. */
:where(.k-root, :root) { --k-tracking-eyebrow: .14em; }

/* ---- type ------------------------------------------------------------- */

.k-eyebrow {
  color: var(--color-text-secondary);
  font-size: var(--font-text-xs-size);
  line-height: var(--font-text-xs-line-height);
  font-weight: var(--font-weight-semibold);
  text-transform: uppercase;
  letter-spacing: var(--k-tracking-eyebrow);
}
.k-title { font-size: var(--font-heading-xs-size); line-height: var(--font-heading-xs-line-height); font-weight: var(--font-weight-semibold); }
.k-heading { font-size: var(--font-heading-md-size); line-height: var(--font-heading-md-line-height); font-weight: var(--font-weight-semibold); }
.k-small { font-size: var(--font-text-sm-size); line-height: var(--font-text-sm-line-height); }
.k-muted { color: var(--color-text-secondary); }
.k-faint { color: var(--color-text-tertiary); }
.k-mono { font-family: var(--font-mono); font-size: var(--font-text-xs-size); line-height: var(--font-text-xs-line-height); }

/* ---- row -------------------------------------------------------------- */

/* A line in a list of things the project contains: a revision, an execution,
   an evidence item, an artifact, an activity entry. One rule, not six. */
.k-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--font-text-sm-size);
  padding: var(--font-text-xs-size) 0;
  border-bottom: var(--border-width-regular) solid var(--color-border-secondary);
  overflow-wrap: anywhere;
}
.k-row:last-child { border-bottom: 0; }
.k-row.k-selectable { cursor: pointer; }
.k-row.k-active { color: var(--color-text-info); }

/* A row the reader picks from rather than reads: project, line, branch. It
   stacks a name over a caption and carries its own border. */
.k-pick {
  display: grid;
  gap: var(--border-radius-xs);
  width: 100%;
  text-align: left;
  padding: var(--font-text-sm-size) var(--font-text-md-size);
  border: var(--border-width-regular) solid var(--color-border-secondary);
  border-radius: var(--border-radius-lg);
  background: var(--color-background-secondary);
  color: var(--color-text-primary);
  cursor: pointer;
}
.k-pick:hover { border-color: var(--color-border-primary); }
.k-pick.k-active { border-color: var(--color-ring-info); box-shadow: var(--shadow-hairline); }
.k-pick small, .k-pick .k-caption { color: var(--color-text-secondary); font-size: var(--font-text-sm-size); line-height: var(--font-text-sm-line-height); }

/* ---- card and dialog -------------------------------------------------- */

.k-card {
  border: var(--border-width-regular) solid var(--color-border-secondary);
  border-radius: var(--border-radius-lg);
  background: var(--color-background-secondary);
  padding: var(--font-text-md-size);
}
.k-card.k-danger { border-color: var(--color-border-danger); color: var(--color-text-secondary); }

/* A dialog is a card that has to read as lifted off the page, so it takes the
   theme's own large shadow instead of a hand-mixed black. */
.k-dialog {
  border: var(--border-width-regular) solid var(--color-border-primary);
  border-radius: var(--border-radius-xl);
  background: var(--color-background-secondary);
  padding: var(--font-heading-sm-size);
  box-shadow: var(--shadow-lg);
}

/* ---- chip ------------------------------------------------------------- */

/* An exact record ref, or a resource the connection declared. Both were their
   own class with their own radius; they are one shape with two paddings. */
.k-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--border-radius-sm);
  font-family: var(--font-mono);
  font-size: var(--font-text-xs-size);
  line-height: var(--font-text-xs-line-height);
  color: var(--color-text-info);
  border: var(--border-width-regular) solid var(--color-border-secondary);
  border-radius: var(--border-radius-md);
  padding: var(--border-radius-xs) var(--border-radius-md);
  cursor: default;
}
.k-chip.k-roomy { padding: var(--border-radius-sm) var(--border-radius-lg); }
.k-chip.k-active { border-color: var(--color-ring-info); }

/* ---- status ----------------------------------------------------------- */

.k-dot { width: var(--font-text-sm-size); height: var(--font-text-sm-size); border-radius: var(--border-radius-full); background: var(--color-text-tertiary); flex: none; }
.k-dot.k-live { background: var(--color-background-success); }
.k-dot.k-danger { background: var(--color-background-danger); }
.k-dot.k-warning { background: var(--color-background-warning); }

/* Semantic text roles, so a surface says "this failed" with the vocabulary
   rather than by reaching for a colour. */
.k-is-danger { color: var(--color-text-danger); }
.k-is-warning { color: var(--color-text-warning); }
.k-is-success { color: var(--color-text-success); }
.k-is-info { color: var(--color-text-info); }

/* ---- controls --------------------------------------------------------- */

.k-btn {
  font: var(--font-weight-medium) var(--font-text-md-size) / var(--font-text-md-line-height) var(--font-sans);
  color: var(--color-text-primary);
  background: var(--color-background-tertiary);
  border: var(--border-width-regular) solid var(--color-border-secondary);
  border-radius: var(--border-radius-lg);
  padding: var(--border-radius-md) var(--font-text-sm-size);
  cursor: pointer;
}
.k-btn:hover:not(:disabled) { border-color: var(--color-border-primary); }
.k-btn:focus-visible { outline: var(--border-width-regular) solid var(--color-ring-primary); outline-offset: var(--border-radius-xs); }
.k-btn:disabled { color: var(--color-text-disabled); background: var(--color-background-disabled); border-color: var(--color-border-disabled); cursor: not-allowed; }
.k-btn.k-primary { color: var(--color-text-inverse); background: var(--color-background-inverse); border-color: var(--color-border-inverse); font-weight: var(--font-weight-bold); }
.k-btn.k-quiet { background: var(--color-background-ghost); border-color: var(--color-border-ghost); color: var(--color-text-secondary); }
.k-btn.k-quiet:hover:not(:disabled) { color: var(--color-text-primary); }

.k-field {
  font: var(--font-weight-normal) var(--font-text-md-size) / var(--font-text-md-line-height) var(--font-sans);
  color: var(--color-text-primary);
  background: var(--color-background-primary);
  border: var(--border-width-regular) solid var(--color-border-secondary);
  border-radius: var(--border-radius-md);
  padding: var(--border-radius-md) var(--border-radius-lg);
}
.k-field:focus-visible { outline: var(--border-width-regular) solid var(--color-ring-info); outline-offset: var(--border-radius-xs); border-color: var(--color-border-info); }
.k-field:disabled { color: var(--color-text-disabled); background: var(--color-background-disabled); }

/* ---- tabs ------------------------------------------------------------- */

.k-tabs { display: flex; gap: var(--border-radius-md); border-bottom: var(--border-width-regular) solid var(--color-border-secondary); padding: var(--border-radius-md) var(--font-text-sm-size) 0; }
.k-tab {
  font: var(--font-weight-medium) var(--font-text-sm-size) / var(--font-text-sm-line-height) var(--font-sans);
  color: var(--color-text-secondary);
  background: var(--color-background-ghost);
  border: var(--border-width-regular) solid var(--color-border-ghost);
  border-bottom: none;
  border-radius: var(--border-radius-md) var(--border-radius-md) 0 0;
  padding: var(--border-radius-md) var(--font-text-md-size);
  cursor: pointer;
}
.k-tab.k-active { color: var(--color-text-primary); background: var(--color-background-secondary); border-color: var(--color-border-secondary); }

/* ---- empty state ------------------------------------------------------ */

/* An empty room must say what to do in it. This is the shape that says so. */
.k-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--font-text-sm-size);
  text-align: center;
  padding: var(--font-heading-2xl-size) var(--font-text-lg-size);
  color: var(--color-text-secondary);
  border: var(--border-width-regular) dashed var(--color-border-secondary);
  border-radius: var(--border-radius-lg);
}
.k-empty .k-title { color: var(--color-text-primary); }

/* ---- caption ---------------------------------------------------------- */

/* The small grey line under a name. It was defined only inside `.k-pick`
   and used everywhere else as if it were a shape of its own. */
.k-caption { color: var(--color-text-secondary); font-size: var(--font-text-sm-size); line-height: var(--font-text-sm-line-height); }

/* ---- who: avatar and state -------------------------------------------- */

/* Somebody, by their first letter. A participant's colour is a semantic
   role of the palette (`.k-is-info` and its kin), never a colour of its
   own, so two surfaces cannot disagree about who is who. */
.k-avatar {
  width: var(--font-heading-xl-line-height);
  height: var(--font-heading-xl-line-height);
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--border-radius-lg);
  border: var(--border-width-regular) solid var(--color-border-secondary);
  background: var(--color-background-tertiary);
  font-weight: var(--font-weight-bold);
}
.k-avatar.k-small { width: var(--font-heading-xs-line-height); height: var(--font-heading-xs-line-height); border-radius: var(--border-radius-md); font-size: var(--font-text-xs-size); line-height: var(--font-text-xs-line-height); }
.k-avatar.k-large { width: var(--font-heading-3xl-line-height); height: var(--font-heading-3xl-line-height); font-size: var(--font-heading-md-size); line-height: var(--font-heading-md-line-height); }
/* A person is round; an agent is not. */
.k-avatar.k-round { border-radius: var(--border-radius-full); }

/* What somebody is doing, in a word, with a dot before it. */
.k-status { display: inline-flex; align-items: center; gap: var(--border-radius-md); white-space: nowrap; color: var(--color-text-secondary); font-size: var(--font-text-sm-size); line-height: var(--font-text-sm-line-height); }
.k-dot.k-small { width: var(--border-radius-lg); height: var(--border-radius-lg); }
.k-dot.k-busy { background: var(--color-text-info); }
.k-dot.k-ready { background: var(--color-text-success); }
.k-dot.k-asking { background: var(--color-text-warning); }

/* How many, beside a name. */
.k-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: var(--font-text-sm-line-height);
  padding: 0 var(--border-radius-md);
  border-radius: var(--border-radius-full);
  background: var(--color-background-tertiary);
  color: var(--color-text-primary);
  font-size: var(--font-text-xs-size);
  line-height: var(--font-text-sm-line-height);
  font-weight: var(--font-weight-semibold);
}

/* ---- rail ------------------------------------------------------------- */

/* The column a product is found by: who there is, what there is, where to
   go. A rail item is a row that is picked, not read. */
.k-rail {
  display: flex;
  flex-direction: column;
  gap: var(--font-text-sm-line-height);
  padding: var(--font-text-sm-line-height) var(--font-text-md-size) var(--font-text-md-size);
  background: var(--color-background-secondary);
  border-right: var(--border-width-regular) solid var(--color-border-secondary);
  min-height: 0;
  overflow: auto;
}
.k-rail-group { display: flex; flex-direction: column; gap: var(--border-radius-sm); }
.k-rail-group > .k-eyebrow { padding: 0 var(--border-radius-md) var(--border-radius-xs); }
.k-rail-item {
  display: flex;
  align-items: center;
  gap: var(--border-radius-lg);
  width: 100%;
  padding: var(--border-radius-md) var(--font-text-xs-size);
  text-align: left;
  font: inherit;
  color: var(--color-text-primary);
  background: var(--color-background-ghost);
  border: var(--border-width-regular) solid var(--color-border-ghost);
  border-radius: var(--border-radius-lg);
  cursor: pointer;
}
.k-rail-item:hover { border-color: var(--color-border-secondary); }
.k-rail-item:focus-visible { outline: var(--border-width-regular) solid var(--color-ring-primary); outline-offset: var(--border-radius-xs); }
.k-rail-item.k-active { background: var(--color-background-primary); border-color: var(--color-ring-info); box-shadow: var(--shadow-hairline); }
.k-rail-item.k-quiet { color: var(--color-text-secondary); }
.k-rail-item.k-quiet.k-active { color: var(--color-text-primary); }
/* The row that makes a new one of what the rows above are. */
.k-rail-item.k-new { color: var(--color-text-secondary); border-style: dashed; border-color: var(--color-border-primary); }
/* A name over a caption, each on one line however long. */
.k-two { display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; }
.k-two > * { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.k-name { font-weight: var(--font-weight-semibold); }

/* ---- segmented -------------------------------------------------------- */

/* A choice of a few, all in sight: light or dark. */
.k-segmented {
  display: inline-flex;
  padding: var(--border-radius-xs);
  gap: var(--border-radius-xs);
  border-radius: var(--border-radius-lg);
  background: var(--color-background-primary);
  border: var(--border-width-regular) solid var(--color-border-secondary);
}
.k-segmented > button {
  display: inline-flex;
  align-items: center;
  gap: var(--border-radius-md);
  padding: var(--border-radius-sm) var(--font-text-xs-size);
  font: inherit;
  font-size: var(--font-text-sm-size);
  line-height: var(--font-text-sm-line-height);
  color: var(--color-text-secondary);
  background: var(--color-background-ghost);
  border: 0;
  border-radius: var(--border-radius-md);
  cursor: pointer;
}
.k-segmented > button[aria-pressed=true] { color: var(--color-text-primary); background: var(--color-background-tertiary); box-shadow: var(--shadow-hairline); }

/* ---- switch ----------------------------------------------------------- */

.k-switch {
  width: var(--font-heading-3xl-size);
  height: var(--font-heading-lg-size);
  flex: none;
  display: flex;
  padding: var(--border-radius-xs);
  border-radius: var(--border-radius-full);
  border: var(--border-width-regular) solid var(--color-border-primary);
  background: var(--color-background-tertiary);
  cursor: pointer;
}
.k-switch > span { width: var(--font-text-md-size); height: var(--font-text-md-size); border-radius: var(--border-radius-full); background: var(--color-text-secondary); }
.k-switch[aria-checked=true] { justify-content: end; background: var(--color-background-inverse); border-color: var(--color-border-inverse); }
.k-switch[aria-checked=true] > span { background: var(--color-text-inverse); }

/* ---- notice ----------------------------------------------------------- */

/* One line the product says about what happened: a semantic border and
   text on a neutral surface, never a filled banner. */
.k-notice {
  display: flex;
  align-items: center;
  gap: var(--font-text-xs-size);
  padding: var(--font-text-xs-size) var(--font-text-sm-size);
  border-radius: var(--border-radius-lg);
  border: var(--border-width-regular) solid var(--color-border-secondary);
  color: var(--color-text-secondary);
  font-size: var(--font-text-sm-size);
  line-height: var(--font-text-sm-line-height);
  overflow-wrap: anywhere;
}
.k-notice.k-info { border-color: var(--color-border-info); color: var(--color-text-primary); }
.k-notice.k-success { border-color: var(--color-border-success); color: var(--color-text-primary); }
.k-notice.k-warning { border-color: var(--color-border-warning); color: var(--color-text-warning); }
.k-notice.k-danger { border-color: var(--color-border-danger); color: var(--color-text-danger); }

/* A card that asks: somebody must answer before anything goes on. */
.k-card.k-asking { border-color: var(--color-border-warning); }

/* ---- what was said ---------------------------------------------------- */

/* What the person at this page said: a bubble at the far side. */
.k-bubble {
  padding: var(--border-radius-lg) var(--font-text-md-size);
  border-radius: var(--border-radius-xl);
  background: var(--color-background-tertiary);
  border: var(--border-width-regular) solid var(--color-border-secondary);
  overflow-wrap: anywhere;
}

/* Something an agent did: what it was called, how far it got. */
.k-toolcall {
  border-radius: var(--border-radius-lg);
  border: var(--border-width-regular) solid var(--color-border-secondary);
  background: var(--color-background-secondary);
}
.k-toolcall > summary { display: flex; align-items: center; gap: var(--border-radius-lg); padding: var(--font-text-xs-size) var(--font-text-sm-size); cursor: pointer; list-style: none; }
.k-toolcall > summary::-webkit-details-marker { display: none; }
.k-toolcall > div { padding: 0 var(--font-text-sm-size) var(--font-text-sm-size); }
.k-toolcall.k-danger { border-color: var(--color-border-danger); }
.k-toolcall pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--color-text-secondary); font-family: var(--font-mono); font-size: var(--font-text-xs-size); line-height: var(--font-text-sm-line-height); }

/* Prose as an agent writes it: paragraphs, lists, tables, code. */
.k-prose { overflow-wrap: anywhere; }
.k-prose > :first-child { margin-top: 0; }
.k-prose > :last-child { margin-bottom: 0; }
.k-prose p, .k-prose ul, .k-prose ol, .k-prose blockquote, .k-prose table, .k-prose pre { margin: 0 0 var(--font-text-sm-size); }
.k-prose h1, .k-prose h2, .k-prose h3, .k-prose h4 { margin: var(--font-text-lg-size) 0 var(--font-text-xs-size); font-weight: var(--font-weight-semibold); }
.k-prose h1 { font-size: var(--font-heading-lg-size); line-height: var(--font-heading-lg-line-height); }
.k-prose h2 { font-size: var(--font-heading-md-size); line-height: var(--font-heading-md-line-height); }
.k-prose h3, .k-prose h4 { font-size: var(--font-heading-sm-size); line-height: var(--font-heading-sm-line-height); }
.k-prose ul, .k-prose ol { padding-left: var(--font-heading-lg-size); }
.k-prose li { margin: var(--border-radius-xs) 0; }
.k-prose a { color: var(--color-text-info); }
.k-prose blockquote { padding-left: var(--font-text-sm-size); border-left: var(--border-radius-xs) solid var(--color-border-primary); color: var(--color-text-secondary); }
.k-prose hr { border: 0; border-top: var(--border-width-regular) solid var(--color-border-secondary); margin: var(--font-text-md-size) 0; }
.k-prose table { border-collapse: collapse; display: block; max-width: 100%; overflow: auto; }
.k-prose th, .k-prose td { padding: var(--border-radius-md) var(--border-radius-lg); border: var(--border-width-regular) solid var(--color-border-secondary); text-align: left; }
.k-prose th { background: var(--color-background-secondary); font-weight: var(--font-weight-semibold); }
.k-prose :not(pre) > code { font-family: var(--font-mono); font-size: var(--font-text-sm-size); padding: var(--border-width-regular) var(--border-radius-sm); border-radius: var(--border-radius-sm); background: var(--color-background-tertiary); }

/* Code, with what it is written in over it. The colours of its words are
   semantic roles, so code reads in both themes and in a foreign host. */
.k-code {
  --k-code-foreground: var(--color-text-primary);
  --k-code-background: var(--color-background-ghost);
  --k-code-token-constant: var(--color-text-info);
  --k-code-token-string: var(--color-text-success);
  --k-code-token-comment: var(--color-text-tertiary);
  --k-code-token-keyword: var(--color-text-danger);
  --k-code-token-parameter: var(--color-text-primary);
  --k-code-token-function: var(--color-text-info);
  --k-code-token-string-expression: var(--color-text-success);
  --k-code-token-punctuation: var(--color-text-secondary);
  --k-code-token-link: var(--color-text-info);
  border-radius: var(--border-radius-lg);
  border: var(--border-width-regular) solid var(--color-border-secondary);
  background: var(--color-background-secondary);
  margin: 0 0 var(--font-text-sm-size);
  overflow: hidden;
}
.k-code > header { display: flex; align-items: center; justify-content: space-between; gap: var(--font-text-sm-size); padding: var(--border-radius-sm) var(--border-radius-sm) var(--border-radius-sm) var(--font-text-sm-size); border-bottom: var(--border-width-regular) solid var(--color-border-secondary); color: var(--color-text-secondary); font-family: var(--font-mono); font-size: var(--font-text-xs-size); line-height: var(--font-text-xs-line-height); }
.k-code pre { margin: 0; padding: var(--font-text-sm-size); overflow: auto; font-family: var(--font-mono); font-size: var(--font-text-sm-size); line-height: var(--font-text-md-line-height); }
.k-code code { font-family: inherit; }

/* ---- menu ------------------------------------------------------------- */

.k-menu {
  padding: var(--border-radius-sm);
  border-radius: var(--border-radius-lg);
  border: var(--border-width-regular) solid var(--color-border-primary);
  background: var(--color-background-secondary);
  box-shadow: var(--shadow-lg);
  color: var(--color-text-primary);
}
.k-menu-item {
  display: flex;
  align-items: center;
  gap: var(--border-radius-lg);
  width: 100%;
  padding: var(--border-radius-md) var(--border-radius-lg);
  border-radius: var(--border-radius-md);
  font: inherit;
  color: inherit;
  background: var(--color-background-ghost);
  border: 0;
  text-align: left;
  cursor: pointer;
}
.k-menu-item:hover, .k-menu-item[data-highlighted] { background: var(--color-background-tertiary); }
</style>
<style>
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; font:var(--font-weight-normal) var(--font-text-md-size)/var(--font-text-md-line-height) var(--font-sans);
    color:var(--color-text-primary); background:var(--color-background-primary); }
  main { display:grid; gap:16px; max-width:640px; margin:0 auto; }
  h1 { margin:0; font-size:var(--font-text-lg-size); }
  .k-card { display:grid; gap:10px; }
  .messages { display:grid; gap:8px; max-height:40vh; overflow:auto; }
  .message { display:grid; gap:2px; }
  .message .k-caption { opacity:.7; }
  .files a, .files button { cursor:pointer; }
  input[type=file] { max-width:100%; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main id="app">
  <section class="k-card" id="who" hidden>
    <h1 id="title"></h1>
    <span class="k-caption" id="you"></span>
  </section>
  <section class="k-card" id="nobody">
    <h1>SWEM</h1>
    <span class="k-caption" id="why">This page is opened from a bot in your messenger, which says who you are.</span>
  </section>
  <section class="k-card" id="send" hidden>
    <span class="k-eyebrow">A file to the agent, of any size</span>
    <input type="file" id="file">
    <input class="k-field" id="words" placeholder="What to say with it (optional)">
    <button class="k-btn k-primary" id="upload" type="button">Send</button>
    <span class="k-caption" id="sending"></span>
  </section>
  <section class="k-card" id="handed" hidden>
    <span class="k-eyebrow">What the agent put out</span>
    <div class="files" id="files"></div>
  </section>
  <section class="k-card" id="chat" hidden>
    <span class="k-eyebrow">The chat</span>
    <div class="messages" id="messages"></div>
  </section>
</main>
<script>
(() => {
  // Served by the Workbench itself, the channel is written in; hosted
  // anywhere else, the bot's button says where the Workbench is and which
  // channel: ?at=https://workbench.example.org&channel=<id>.
  const query = new URLSearchParams(location.search);
  const channel = query.get("channel") || "";
  const at = (query.get("at") || "").replace(/\/+$/, "");
  const api = `${at}/api/channels/${encodeURIComponent(channel)}/app`;
  const $ = (id) => document.getElementById(id);
  // What the messenger signed, from the fragment it opens the page with.
  // The page needs no script of the messenger's: the signed data is in the
  // address, and the channel is what checks it.
  const fromHash = () => {
    const hash = location.hash.startsWith("#") ? location.hash.slice(1) : location.hash;
    const found = new URLSearchParams(hash).get("tgWebAppData");
    return found ?? "";
  };
  const initData = fromHash();
  const headers = { "x-swem-app-data": initData };
  const when = (ms) => (ms ? new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "");
  const show = (standing) => {
    $("nobody").hidden = true;
    for (const id of ["who", "send", "handed", "chat"]) $(id).hidden = false;
    $("title").textContent = standing.bot && standing.bot.name ? standing.bot.name : standing.chat.title;
    $("you").textContent = `You are ${standing.you.name} here; ${standing.agent} answers.`;
    const files = $("files");
    files.replaceChildren();
    if (standing.files.length === 0) {
      const none = document.createElement("span");
      none.className = "k-caption";
      none.textContent = "Nothing yet.";
      files.append(none);
    }
    for (const file of standing.files) {
      const row = document.createElement("div");
      row.className = "k-row";
      row.dataset.file = file.name;
      const name = document.createElement("span");
      name.className = "k-name k-grow";
      name.textContent = file.name;
      const size = document.createElement("span");
      size.className = "k-caption";
      size.textContent = `${Math.max(1, Math.round(file.byte_length / 1024))} KB`;
      const get = document.createElement("button");
      get.className = "k-btn k-quiet";
      get.type = "button";
      get.textContent = "Save";
      get.addEventListener("click", async () => {
        const response = await fetch(`${api}/files/${encodeURIComponent(file.name)}`, { headers });
        if (!response.ok) return;
        const url = URL.createObjectURL(await response.blob());
        const a = document.createElement("a");
        a.href = url;
        a.download = file.name;
        a.click();
        URL.revokeObjectURL(url);
      });
      row.append(name, size, get);
      files.append(row);
    }
    const messages = $("messages");
    messages.replaceChildren();
    for (const message of standing.messages) {
      const one = document.createElement("div");
      one.className = "message";
      one.dataset.message = "";
      const by = document.createElement("span");
      by.className = "k-caption";
      by.textContent = `${message.by} · ${when(message.at_ms)}`;
      const text = document.createElement("span");
      text.textContent = message.text;
      one.append(by, text);
      messages.append(one);
    }
    messages.scrollTop = messages.scrollHeight;
  };
  const read = async () => {
    if (!initData) return;
    const response = await fetch(api, { headers });
    if (!response.ok) {
      const said = await response.json().catch(() => ({}));
      $("why").textContent = said.error || `The Workbench did not let this page in (${response.status}).`;
      $("why").dataset.refused = String(response.status);
      return;
    }
    show(await response.json());
  };
  const readOrSay = async () => {
    try {
      await read();
    } catch {
      $("why").textContent = at
        ? `The Workbench at ${at} cannot be reached from here. It has to be served at an address the messenger can reach.`
        : "The Workbench cannot be reached from here.";
      $("why").dataset.unreachable = "";
    }
  };
  $("upload").addEventListener("click", async () => {
    const file = $("file").files[0];
    if (!file) return;
    $("sending").textContent = `Sending ${file.name}…`;
    $("upload").disabled = true;
    try {
      const response = await fetch(`${api}/files?name=${encodeURIComponent(file.name)}&words=${encodeURIComponent($("words").value)}`, {
        method: "POST",
        headers: { ...headers, "content-type": file.type || "application/octet-stream" },
        body: file,
      });
      const said = await response.json().catch(() => ({}));
      $("sending").textContent = response.ok ? `Sent ${said.name} to the agent.` : said.error || `Not sent (${response.status}).`;
      if (response.ok) $("sending").dataset.sent = said.name;
      await read();
    } finally {
      $("upload").disabled = false;
    }
  });
  // The messenger opens the page with its data in the fragment; opened
  // again with other data, the page starts over.
  window.addEventListener("hashchange", () => location.reload());
  void readOrSay();
  setInterval(() => void readOrSay(), 5000);
})();
</script>
</body>
</html>

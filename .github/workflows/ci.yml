# Format, lint, the crate suites and the page's node suite, on Linux and macOS.
# The browser walks are `scripts/gate.sh`, in `gate.yml`, started by hand: they
# take ten minutes and a real browser.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The passkey library links the system's OpenSSL.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: (cd crates/swem-host/web/apps-host && npm ci)
      - run: scripts/suites.sh

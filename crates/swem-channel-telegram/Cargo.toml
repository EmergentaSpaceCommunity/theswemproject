[package]
name = "swem-channel-telegram"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A channel for the SWEM Workbench: a Telegram bot, answering the channel shape over the Bot API."
publish = false

[[bin]]
name = "swem-channel-telegram"
path = "src/main.rs"

[dependencies]
getrandom.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart", "stream"] }
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
swem-sdk = { path = "../swem-sdk" }
tokio.workspace = true

[lints]
workspace = true

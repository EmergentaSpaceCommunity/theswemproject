# The workspace does not build on an older compiler: `sysinfo` 0.39, which
# looks at the machine an agent would run on, needs 1.95. Without this file a
# clean checkout fails with an error about a dependency rather than about the
# toolchain.
#
# It only works for whoever lets rustup read this file. `RUSTUP_TOOLCHAIN` in
# the environment overrides it outright, components included.
[toolchain]
channel = "1.95.0"
components = ["clippy", "rustfmt"]
